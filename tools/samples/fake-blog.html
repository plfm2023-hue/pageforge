<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fake Blog — PageForge Test</title>
  <style>
    body { font-family: Georgia, serif; max-width: 720px; margin: 0 auto; padding: 32px; }
    .post { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
    h2 { font-size: 28px; }
    .meta a { color: #2563eb; margin-right: 12px; }
    .read-more { display: inline-block; width: 120px; padding: 8px; border: 1px solid #2563eb; color: #2563eb; text-align: center; }
  </style>
</head>
<body>
  <article class="post">
    <h2>Why We Built a Fake Blog</h2>
    <div class="meta">
      <a href="https://example.com/author">By Test Author</a>
      <a href="https://example.com/category">Testing</a>
    </div>
    <p>A short paragraph to confirm text nodes convert correctly.</p>
    <a class="read-more" href="https://example.com/post/1">Read more</a>
  </article>
  <article class="post">
    <h2>Another Post Title</h2>
    <div class="meta">
      <a href="https://example.com/author2">By Other Author</a>
    </div>
    <a class="read-more" href="https://example.com/post/2">Read more</a>
  </article>
</body>
</html>
